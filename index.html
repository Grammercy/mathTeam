<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Math Practice</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e1e2e'/%3E%3Cpath d='M16 19h32M16 32h32M16 45h32' stroke='%23cba6f7' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }, svg: { fontCache: 'global' } };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href=".">Math Practice<span>.</span></a>
      <nav class="tabs" aria-label="Sections">
        <button class="tab active" type="button" data-tab="practice">Practice</button>
        <button class="tab" type="button" data-tab="formulas">Formulas</button>
      </nav>
      <div class="controls">
        <label class="sr-only" for="source">Packet</label>
        <select id="source">
          <option value="all">All packets</option>
          <option value="Regional">Regional</option>
          <option value="State">State</option>
        </select>
        <span id="progress" class="progress"></span>
      </div>
    </header>

    <section class="practice" aria-live="polite">
      <div class="meta" id="meta"></div>
      <div id="question" class="question">Loading…</div>
      <div id="diagram" class="diagram" hidden></div>
      <form id="answer-form" class="answer-form">
        <label class="sr-only" for="answer">Your answer</label>
        <input id="answer" name="answer" autocomplete="off" spellcheck="false" placeholder="Enter your answer" autofocus>
        <button type="submit">Check</button>
      </form>
      <div id="result" class="result" hidden></div>
      <button id="explain" class="explain" type="button" hidden aria-expanded="false">Show explanation</button>
      <div id="solution" class="solution" hidden></div>
      <div id="formula" class="formula" hidden></div>
      <button id="next" class="next" type="button" hidden>Next problem <span>↵</span></button>
    </section>
    <section id="formula-view" class="formula-view" hidden aria-label="Formula notes">
      <div id="formula-list" class="formula-list"></div>
    </section>
  </main>
  <script src="problems.js"></script>
  <script src="solutions.js"></script>
  <script src="formula_notes.js"></script>
  <script src="formula_reference.js"></script>
  <script src="app.js"></script>
</body>
</html>
